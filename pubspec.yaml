name: timer_widget
description: >
  All-in-one Flutter timer widget with countdown, cooldown, debounce, and async loader. 
  Perfect for OTP resend buttons, rate limiting, form submission, API loading with retry. 
  Zero dependencies - internal state management. Fully customizable with controller support.
version: 1.0.0
homepage: https://github.com/HassanAmeer/timer_widget_flutter_package
repository: https://github.com/HassanAmeer/timer_widget_flutter_package
issue_tracker: https://github.com/HassanAmeer/timer_widget_flutter_package/issues
documentation: https://github.com/HassanAmeer/timer_widget_flutter_package#readme

# SEO Topics/Keywords for pub.dev ranking
topics:
  - timer
  - countdown
  - button
  - loading
  - ui

# Funding links (optional)
# funding:
#   - https://github.com/sponsors/HassanAmeer

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

screenshots:
  - description: Timer Widget - Countdown, Cooldown, Debounce, Async Loader
    path: screenshots/demo.png

flutter:
